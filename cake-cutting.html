<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cut the Birthday Cake</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="cake-cutting">
  <main class="stage-container">
    <section class="storybook-card">
      <span class="eyebrow-tag">Chapter V &bull; Sweet Celebration</span>
      <h1>Slice the Birthday Cake</h1>
      <p class="lead-text">Tap the cake or click the button to slice your birthday cake.</p>

      <div id="cuttable-cake-stage" class="cake-stage">
        <div id="cake-knife" class="cake-knife"></div>
        <div class="cake-halves">
          <div class="cake-half left"></div>
          <div class="cake-half right"></div>
        </div>
      </div>

      <button id="cut-cake-btn" class="magic-btn" type="button">SLICE CAKE</button>

      <div id="cake-secret-reveal" class="reveal-panel">
        <p id="cake-secret-text"></p>
      </div>

      <div class="btn-row">
        <button id="cake-next-btn" class="magic-btn" data-nav="memories.html" type="button" disabled>EXPLORE MEMORIES</button>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
