<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Make a Wish &amp; Blow the Candles</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="candles">
  <main class="stage-container">
    <section class="storybook-card">
      <span class="eyebrow-tag">Chapter IV &bull; Birthday Wish</span>
      <h1>Close Your Eyes &amp; Make a Wish</h1>
      <p id="mic-status" class="lead-text">Use your microphone to blow out the candles, or tap the button below.</p>

      <div class="cake-stage">
        <div class="candles-row">
          <div class="candle-unit"><span class="candle-flame"></span><span class="candle-smoke"></span></div>
          <div class="candle-unit"><span class="candle-flame"></span><span class="candle-smoke"></span></div>
          <div class="candle-unit"><span class="candle-flame"></span><span class="candle-smoke"></span></div>
          <div class="candle-unit"><span class="candle-flame"></span><span class="candle-smoke"></span></div>
          <div class="candle-unit"><span class="candle-flame"></span><span class="candle-smoke"></span></div>
        </div>
        <div class="cake-halves">
          <div class="cake-half left"></div>
          <div class="cake-half right"></div>
        </div>
      </div>

      <div class="btn-row">
        <button id="enable-mic-btn" class="pill-btn pill-btn-soft" type="button">Use Microphone Blow</button>
        <button id="blow-candles-btn" class="magic-btn" type="button">BLOW THE CANDLES</button>
      </div>

      <div id="candle-wish-reveal" class="reveal-panel">
        <p id="candle-wish-text"></p>
      </div>

      <div class="btn-row">
        <button id="candles-next-btn" class="magic-btn" data-nav="cake-cutting.html" type="button" disabled>CUT THE CAKE</button>
      </div>
    </section>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/animations.js"></script>
</body>
</html>
