<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gift 3: Something From My Heart</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="gift3">
  <main class="stage-container">
    <section class="storybook-card">
      <span class="eyebrow-tag">Gift 3 &bull; From My Heart</span>
      <h1>Break the Wax Seal</h1>
      <p class="lead-text">Tap the rose wax seal to unseal this note.</p>

      <div id="wax-envelope" class="envelope-wrapper">
        <div class="envelope-flap"></div>
        <button id="wax-seal-btn" class="wax-seal" type="button" aria-label="Break Wax Seal">OPEN</button>
      </div>

      <div class="letter-sheet">
        <p id="gift3-message"></p>
      </div>

      <div class="btn-row">
        <button id="gift3-return-btn" class="magic-btn" data-nav="gifts.html" type="button" disabled>BACK TO ALL 3 GIFTS</button>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
