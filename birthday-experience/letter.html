<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Secret Letter For You</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="letter">
  <main class="stage-container">
    <section class="storybook-card">
      <span class="eyebrow-tag">Chapter X &bull; Handwritten Note</span>
      <h1>A Letter From <span data-sender-name>Your Best Friend</span></h1>

      <div id="secret-letter-envelope" class="envelope-wrapper">
        <div class="envelope-flap"></div>
        <button id="open-letter-btn" class="magic-btn" type="button" style="z-index: 4;">UNFOLD LETTER</button>
      </div>

      <article id="unfolded-letter-paper" class="letter-sheet">
        <div id="secret-letter-body"></div>
      </article>

      <div class="btn-row">
        <button id="letter-continue-btn" class="magic-btn" data-nav="finale.html" type="button" disabled>ENTER THE GRAND FINALE</button>
      </div>
    </section>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/animations.js"></script>
</body>
</html>
