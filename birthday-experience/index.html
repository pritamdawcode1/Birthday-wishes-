<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Secret Surprise Awaits...</title>
  <link rel="stylesheet" href="/Birthday-wishes-/css/style.css" />
</head>
<body data-page="entrance">
  <main class="stage-container">
    <section class="storybook-card">
      <span class="eyebrow-tag">For <span data-friend-name>You</span></span>
      <h1>Psst... Someone has a surprise for you!</h1>
      <p class="lead-text">Turn up your sound and tap the magical gift box below to begin your birthday adventure.</p>

      <div id="entrance-gift-box" class="gift-3d-scene" role="button" tabindex="0" aria-label="Birthday Gift Box">
        <div class="gift-3d-box">
          <div class="gift-bow"></div>
          <div class="gift-lid"></div>
          <div class="gift-base"></div>
        </div>
      </div>

      <button id="open-surprise-btn" class="magic-btn" type="button">OPEN YOUR SURPRISE</button>
    </section>
  </main>

  <script src="/Birthday-wishes-/js/config.js"></script>
  <script src="/Birthday-wishes-/js/navigation.js"></script>
  <script src="/Birthday-wishes-/js/shared.js"></script>
  <script src="/Birthday-wishes-/js/animations.js"></script>
</body>
</html>
