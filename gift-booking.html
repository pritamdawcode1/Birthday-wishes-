<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Give your current address that i can send your gift</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="gift-booking">
  <main class="stage-container">
    <section class="storybook-card">
      <span class="eyebrow-tag">Special Surprise Delivery</span>
      <h1>Where Should I Send Your Gift?</h1>
      <p class="lead-text">Give your current address so that I can send your gift, <span data-friend-name>Friend</span>!</p>

      <form id="gift-booking-form" style="display: flex; flex-direction: column; gap: 14px; text-align: left; margin: 20px 0;">
        <div>
          <label for="book-name" style="font-size: 0.85rem; font-weight: 700; color: var(--ink-secondary); display: block; margin-bottom: 4px;">Full Name</label>
          <input type="text" id="book-name" class="wish-input" style="width: 100%;" required placeholder="Enter your full name" />
        </div>
        <div>
          <label for="book-address" style="font-size: 0.85rem; font-weight: 700; color: var(--ink-secondary); display: block; margin-bottom: 4px;">Shipping Address</label>
          <textarea id="book-address" class="wish-input" style="width: 100%; border-radius: 14px; resize: vertical; min-height: 80px; font-family: inherit;" required placeholder="Street address, apartment, suite, etc."></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div>
            <label for="book-city" style="font-size: 0.85rem; font-weight: 700; color: var(--ink-secondary); display: block; margin-bottom: 4px;">City &amp; State</label>
            <input type="text" id="book-city" class="wish-input" style="width: 100%;" required placeholder="City, State" />
          </div>
          <br>
          <div>
            <label for="book-pincode" style="font-size: 0.85rem; font-weight: 700; color: var(--ink-secondary); display: block; margin-bottom: 4px;">Pin Code</label>
            <input type="text" id="book-pincode" class="wish-input" style="width: 100%;" required placeholder="Pin code" />
          </div>
        </div>
        <div>
          <label for="book-phone" style="font-size: 0.85rem; font-weight: 700; color: var(--ink-secondary); display: block; margin-bottom: 4px;">Phone Number</label>
          <input type="tel" id="book-phone" class="wish-input" style="width: 100%;" required placeholder="Mobile number for delivery" />
        </div>
        <button type="submit" class="magic-btn" style="width: 100%; margin-top: 10px;">SUBMIT MY ADDRESS</button>
      </form>

      <div id="booking-success-msg" class="reveal-panel">
        <p><strong>Package Confirmed!</strong> Your delivery details have been securely saved. Get ready for a wonderful surprise at your doorstep!</p>
      </div>

      <div class="btn-row" style="margin-top: 18px;">
        <button class="pill-btn pill-btn-soft" data-nav="gifts.html" type="button">&larr; Back to Gifts Hub</button>
        <button id="booking-next-btn" class="magic-btn" data-nav="quiz.html" type="button" disabled>CONTINUE ADVENTURE</button>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
