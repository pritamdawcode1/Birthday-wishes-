<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Ultimate Friendship Quiz</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="quiz">
  <main class="stage-container">
    <section id="quiz-active-card" class="storybook-card">
      <span class="eyebrow-tag">Chapter VIII &bull; Friendship Challenge</span>
      <div style="display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 10px;">
        <span id="quiz-counter">Question 1 of 5</span>
        <span id="quiz-score-badge">Score: 0</span>
      </div>
      <h2 id="quiz-question-text" style="font-family: var(--font-display);"></h2>
      <div id="quiz-options" class="quiz-options"></div>
      <p id="quiz-feedback" class="quiz-feedback"></p>
      <button id="quiz-next-btn" class="magic-btn" type="button" disabled>NEXT QUESTION</button>
    </section>

    <section id="quiz-result-card" class="storybook-card" hidden>
      <span class="eyebrow-tag">Quiz Complete!</span>
      <h1>Your Score: <span id="final-quiz-score">5 / 5</span></h1>
      <p class="lead-text">Official verdict: Best Friend Hall of Fame material!</p>
      <button class="magic-btn" data-nav="garden.html" type="button">VISIT THE WISH GARDEN</button>
    </section>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/animations.js"></script>
</body>
</html>
