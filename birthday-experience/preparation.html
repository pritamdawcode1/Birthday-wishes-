<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preparing Your Birthday Surprise</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="preparation">
  <main class="stage-container">
    <section class="storybook-card">
      <span class="eyebrow-tag">Chapter III &bull; Magical Bakery</span>
      <h1>Baking Something Special...</h1>

      <!-- Kawaii Pastel Chef SVG -->
      <svg viewBox="0 0 200 160" width="180" height="145" aria-label="Cute Pastel Chef">
        <circle cx="100" cy="95" r="42" fill="#ffe5ec" />
        <path d="M62 65 C55 35, 145 35, 138 65 Z" fill="#ffffff" stroke="#e0bbf9" stroke-width="3" />
        <circle cx="86" cy="92" r="4.5" fill="#4a354f" />
        <circle cx="114" cy="92" r="4.5" fill="#4a354f" />
        <path d="M93 105 Q100 113 107 105" fill="none" stroke="#f472b6" stroke-width="3.5" stroke-linecap="round" />
        <ellipse cx="100" cy="142" rx="48" ry="14" fill="#ffdab9" />
      </svg>

      <p id="prep-status-text" class="lead-text">Sifting clouds of vanilla sugar...</p>

      <div class="progress-track" style="max-width: 420px; height: 14px; margin: 0 auto;">
        <div id="prep-progress-bar" class="progress-fill" style="width: 0%;"></div>
      </div>
      <p id="prep-percent" style="font-weight: 700; margin-top: 10px;">0%</p>
    </section>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/animations.js"></script>
</body>
</html>
